name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Build binaries
        run: |
          mkdir -p dist

          # macOS Intel
          GOOS=darwin GOARCH=amd64 go build -ldflags "-s -w" -o dist/hydra-darwin-amd64 cmd/hydra/main.go
          tar czf dist/hydra-darwin-amd64.tar.gz -C dist hydra-darwin-amd64

          # macOS Apple Silicon
          GOOS=darwin GOARCH=arm64 go build -ldflags "-s -w" -o dist/hydra-darwin-arm64 cmd/hydra/main.go
          tar czf dist/hydra-darwin-arm64.tar.gz -C dist hydra-darwin-arm64

          # Linux x86_64
          GOOS=linux GOARCH=amd64 go build -ldflags "-s -w" -o dist/hydra-linux-amd64 cmd/hydra/main.go
          tar czf dist/hydra-linux-amd64.tar.gz -C dist hydra-linux-amd64

          # Linux ARM64
          GOOS=linux GOARCH=arm64 go build -ldflags "-s -w" -o dist/hydra-linux-arm64 cmd/hydra/main.go
          tar czf dist/hydra-linux-arm64.tar.gz -C dist hydra-linux-arm64

          # Windows x86_64
          GOOS=windows GOARCH=amd64 go build -ldflags "-s -w" -o dist/hydra-windows-amd64.exe cmd/hydra/main.go
          zip -j dist/hydra-windows-amd64.zip dist/hydra-windows-amd64.exe

      - name: Generate checksums
        run: |
          cd dist
          sha256sum *.tar.gz *.zip > checksums.txt

      - name: Extract release notes
        id: release_notes
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          # Extract release notes from CHANGELOG.md
          awk "/## \[$VERSION\]/,/## \[/" CHANGELOG.md | sed '1d;$d' > release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          body_path: release_notes.md
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Homebrew formula
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "🍺 Homebrew formula update would happen here"
          echo "See homebrew/hydra.rb for template"
