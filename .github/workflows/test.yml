name: Test

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]

jobs:
  test:
    name: Test
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        go: ['1.24']

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Install Python (for test fixtures)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download dependencies
        run: go mod download

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest

      - name: Run unit tests (excluding integration tests)
        run: go test -race -coverprofile=coverage.out $(go list ./... | grep -v '/test/integration')

      - name: Check coverage
        run: |
          coverage=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "Coverage: $coverage%"
          if (( $(echo "$coverage < 65" | bc -l) )); then
            echo "❌ Coverage $coverage% is below 65% target"
            exit 1
          fi
          echo "✅ Coverage $coverage% meets 65% target"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.out
          flags: unittests
          name: codecov-${{ matrix.os }}

      - name: Build hydra binary for integration tests
        run: |
          go build -o hydra cmd/hydra/main.go
          chmod +x hydra

      - name: Build test fixtures
        run: |
          cd test/fixtures/mcp_servers
          go build -o go_server go_server.go
          chmod +x go_server
          chmod +x python_server.py
          chmod +x node_server.js

      - name: Install hydra to PATH
        run: |
          mkdir -p $HOME/bin
          cp hydra $HOME/bin/
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Verify hydra binary is accessible
        run: |
          export PATH="$HOME/bin:$PATH"
          which hydra
          hydra --help || echo "Help command not available, binary exists"

      - name: Run integration tests
        run: |
          export PATH="$HOME/bin:$PATH"
          go test -race -v ./test/integration/...

      - name: Run benchmark tests (validation only)
        run: go test -bench=. -benchtime=1x ./test/benchmarks/...

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Build for multiple platforms
        run: |
          mkdir -p bin
          GOOS=darwin GOARCH=amd64 go build -o bin/hydra-darwin-amd64 cmd/hydra/main.go
          GOOS=darwin GOARCH=arm64 go build -o bin/hydra-darwin-arm64 cmd/hydra/main.go
          GOOS=linux GOARCH=amd64 go build -o bin/hydra-linux-amd64 cmd/hydra/main.go
          GOOS=linux GOARCH=arm64 go build -o bin/hydra-linux-arm64 cmd/hydra/main.go
          GOOS=windows GOARCH=amd64 go build -o bin/hydra-windows-amd64.exe cmd/hydra/main.go

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: bin/
          retention-days: 7
